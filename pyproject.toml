[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "databrowser"
version = "0.1"
description = "Write static HTML pages for browsing data: tables of links and grids of images"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
databrowser = ["style/*.css"]

[tool.pytest.ini_options]
cache_dir = ".build/pytest"
pythonpath = ["src"]
testpaths = ["tests"]
# pytest-benchmark makes .benchmarks/ in the root just by loading, and nothing here uses it.
addopts = "-p no:benchmark -ra"
markers = [
    "long: integration, end-to-end, property, visual and scaling tests; tests/run-tests.sh long",
    "perf: timing and memory gates against this machine's baseline; tests/run-tests.sh perf",
]

[tool.coverage.run]
data_file = ".build/coverage"
branch = true
source = ["databrowser"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = ".build/htmlcov"

[tool.mutmut]
source_paths = ["src/databrowser/"]
# The interface tests run the demo script.
also_copy = ["examples/"]
pytest_add_cli_args_test_selection = ["tests/", "-m", "not long and not perf", "-p", "no:randomly"]

[tool.mypy]
cache_dir = ".build/mypy"

[tool.ruff]
cache-dir = ".build/ruff"
line-length = 120

[tool.house-lint]
line-length = 120
stdlib-only = true                 # Anaconda 2025 packages are allowed too, but none is needed yet

# The numbers docs/testing.md states, checked by doc-counts.
[[tool.doc-counts.count]]
file = "docs/testing.md"
pattern = '\| `tests/run-tests\.sh` \| [^|]+\| ([\d,]+) \|'
source = { pytest = "-m 'not long and not perf'" }

[[tool.doc-counts.count]]
file = "docs/testing.md"
pattern = '\| `tests/run-tests\.sh long` \| [^|]+\| ([\d,]+) \|'
source = { pytest = "-m long" }

[[tool.doc-counts.count]]
file = "docs/testing.md"
pattern = '\| `tests/run-tests\.sh all` \| [^|]+\| ([\d,]+) \|'
source = { pytest = "-m 'not perf'" }

[[tool.doc-counts.count]]
file = "docs/testing.md"
pattern = '\| `tests/run-tests\.sh cov` \| [^|]+\| ([\d,]+) \|'
source = { pytest = "-m 'not long and not perf'" }

[[tool.doc-counts.count]]
file = "docs/testing.md"
pattern = '`tests/examples/` holds (\d+) simple, (\d+) moderate and (\d+) complex cases, `tests/failures/` (\d+)\.'
sources = [
    { glob = "tests/examples/simple/*/build.py" },
    { glob = "tests/examples/moderate/*/build.py" },
    { glob = "tests/examples/complex/*/build.py" },
    { glob = "tests/failures/*/build.py" },
]
